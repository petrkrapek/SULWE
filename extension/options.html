<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Shrnutí stránky – nastavení</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    label { display: block; font-weight: 600; margin: 16px 0 4px; }
    .hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    input, select {
      font: inherit;
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
    }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .actions { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
    #status { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Shrnutí stránky – nastavení</h1>
  <form id="form">
    <label for="apiKey">API klíč Anthropic</label>
    <div class="row">
      <input id="apiKey" name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
      <button type="button" id="toggle-key">Zobrazit</button>
    </div>
    <p class="hint">
      Klíč získáte na <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.
      Ukládá se jen v tomto prohlížeči a posílá se pouze na api.anthropic.com.
    </p>

    <label for="model">Model</label>
    <select id="model" name="model"></select>

    <label for="language">Jazyk shrnutí</label>
    <select id="language" name="language"></select>

    <label for="length">Délka shrnutí</label>
    <select id="length" name="length"></select>

    <div class="actions">
      <button type="submit" class="primary">Uložit</button>
      <span id="status" role="status"></span>
    </div>
  </form>
  <script type="module" src="dist/options.js"></script>
</body>
</html>
