<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Shrnutí stránky</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 id="page-title">Shrnutí stránky</h1>
    <button id="options" class="icon-button" title="Nastavení" aria-label="Nastavení">⚙</button>
  </header>
  <main>
    <div id="status" class="status" hidden></div>
    <div id="notice" class="notice" hidden></div>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="setup" class="setup" hidden>
      <p>Pro shrnování je potřeba zadat <strong>API klíč od Anthropic</strong>.</p>
      <button id="open-options" class="primary">Otevřít nastavení</button>
    </div>
    <div id="summary" class="summary" aria-live="polite"></div>
  </main>
  <footer>
    <span id="meta" class="meta"></span>
    <button id="copy" disabled>Kopírovat</button>
    <button id="regenerate" disabled>Shrnout znovu</button>
  </footer>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
