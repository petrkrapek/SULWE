<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Shrnu.to</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="heading">
      <h1 id="page-title">Shrnu.to</h1>
      <div id="meta" class="meta"></div>
    </div>
    <button id="options" class="icon-button" title="Nastavení" aria-label="Nastavení">⚙</button>
  </header>
  <div id="verdict" class="verdict" hidden><span class="dot"></span><span class="verdict-text"></span></div>
  <main>
    <div id="status" class="status" hidden></div>
    <div id="notice" class="notice" hidden></div>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="setup" class="setup" hidden>
      <p>Pro shrnování je potřeba zadat <strong>API klíč od <span id="setup-provider">Anthropic</span></strong>.</p>
      <button id="open-options" class="primary">Otevřít nastavení</button>
    </div>
    <div id="summary" class="summary" aria-live="polite"></div>
  </main>
  <footer>
    <button id="verify" hidden>Ověřit</button>
    <button id="copy" disabled>Kopírovat</button>
    <button id="regenerate" disabled title="Vytvořit nové shrnutí">Znovu</button>
    <button id="pin" disabled hidden>Pin</button>
  </footer>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
